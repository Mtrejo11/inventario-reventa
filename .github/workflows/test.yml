name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Regenerate lockfile in CI to work around npm/cli#4828
      # (rollup optional deps are platform-specific and the lock generated on
      # macOS arm64 doesn't include linux x64 binaries).
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
